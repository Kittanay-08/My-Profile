<!DOCTYPE html>
<html lang="th">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นามบัตรออนไลน์ของฉันน</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="card">
        <img class="card__avatar" src="https://avatars.githubusercontent.com/u/9919?v=4" alt="รูปโปรไฟล์">
        <h1 class="card__name">ชื่อ นามสกุล</h1>
        <p class="card__title">นักศึกษาวิศวกรรมคอมพิวเตอร์</p>
        <p class="card__bio">กำลังเรียนรู้ Full-stack Development และ DevOps</p>
 
        <ul class="card__links">
            <li><a href="https://github.com/Kittanay-08">GitHub</a></li>
            <li><a href="mailto:kittanay1234@gmail.com">Email</a></li>
        </ul>
 
        <button id="theme-toggle" class="card__button">🌙 โหมดกลางคืน</button>
        
        <p class="card__note">ทดสอบหัวข้อพิเศษซอฟแวร์</p>

        <footer id="card-footer" class="card__footer"></footer>

        <p class="card__note">ลองพิมพ์ชื่อของคุณที่นี่</p>
        <input type="text" id="name-input" class="input-box" placeholder="พิมพ์ชื่อ - นามสกุลใหม่ที่นี่...">
    </main>
 
    <script src="./script.js"></script>
</body>
</html>
